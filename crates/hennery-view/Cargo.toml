[package]
name = "hennery-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/build.rs"]
description = "Pure display fold for hennery session events"

# The generator is a developer tool, not a release archive or installer.
[package.metadata.dist]
dist = false

[dependencies]
hennery-proto.workspace = true
schemars.workspace = true
serde.workspace = true
# The adapter's order of an elicitation's fields is the order its form
# shows them in: kept whatever else the build enables.
serde_json = { workspace = true, features = ["preserve_order"] }
ts-rs.workspace = true

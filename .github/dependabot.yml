version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    ignore:
      # web-push-native 0.5 accepts p256 0.13 keys; migrate them together.
      - dependency-name: p256
        versions: ["0.14.*"]
    groups:
      cargo:
        patterns: ["*"]

  # pnpm uses the npm ecosystem. Adapter locks belong to pins-watch.
  - package-ecosystem: npm
    directory: /web
    # Upgrade Playwright together with nixpkgs-web's browser bundle in flake.nix.
    ignore:
      - dependency-name: "@playwright/test"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]

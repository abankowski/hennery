name: release-tests
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
    - .github/actions/**
    - packaging/**
    - Cargo.toml
    - Cargo.lock
    - dist-workspace.toml
    - flake.nix
    - flake.lock
    - nix/**
    - .cargo/**
    - rust-toolchain*
    - crates/**/build.rs
    - crates/**/Cargo.toml
    - crates/**/package_ui.rs
    - Dockerfile
    - .dockerignore
    - web/package.json
    - web/.npmrc
    - web/pnpm-lock.yaml
    - web/*.config.*
    - web/tsconfig*.json
    - adapters/**
    - crates/hennery-host/manifest.json
    - README.md
  pull_request:
    paths:
    - .github/workflows/**
    - .github/actions/**
    - packaging/**
    - Cargo.toml
    - Cargo.lock
    - dist-workspace.toml
    - flake.nix
    - flake.lock
    - nix/**
    - .cargo/**
    - rust-toolchain*
    - crates/**/build.rs
    - crates/**/Cargo.toml
    - crates/**/package_ui.rs
    - Dockerfile
    - .dockerignore
    - web/package.json
    - web/.npmrc
    - web/pnpm-lock.yaml
    - web/*.config.*
    - web/tsconfig*.json
    - adapters/**
    - crates/hennery-host/manifest.json
    - README.md
  workflow_dispatch: null

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refusal-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ''
      - name: Execute the exact README bootstrap against signed offline releases
        run: |
          sh packaging/readme-blocks.sh README.md release-bootstrap > "$RUNNER_TEMP/release-bootstrap.sh"
          nix develop .#release -c python3 packaging/release/test_bootstrap.py --script "$RUNNER_TEMP/release-bootstrap.sh"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64-unknown-linux-musl' || matrix.os == 'ubuntu-24.04' && 'x86_64-unknown-linux-musl' || 'aarch64-apple-darwin' }}
      - name: Native fixture musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo-dist's actual installer with tiny shell executables
        run: |
          sh packaging/install-dist.sh "$RUNNER_TEMP/dist-bin"
          HENNERY_TEST_DIST="$RUNNER_TEMP/dist-bin/dist" nix develop .#release -c python3 -m unittest discover -s packaging/release -p 'test_dist_*.py'
          "$RUNNER_TEMP/dist-bin/dist" build --artifacts=global
          python3 packaging/release/make_installer_fixture.py target/distrib/hennery-installer.sh "$RUNNER_TEMP/installer-fixture"
          python3 packaging/harden-installer.py "$RUNNER_TEMP/installer-fixture/hennery-installer.sh"
          sh packaging/test-installer.sh "$RUNNER_TEMP/installer-fixture"
      - name: Actionlint
        run: nix develop .#release -c actionlint .github/workflows/release.yml .github/workflows/release-*.yml

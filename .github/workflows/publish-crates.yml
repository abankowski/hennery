name: publish-crates

# R1 INTEGRATION POINT. Only the approved orchestrator may call this workflow.
# Deliberately disabled until its retained-candidate and authenticated gate adapter
# is reviewed and supplied. No dispatch/tag/version trigger, no bootstrap secret.
on:
  workflow_call:
    inputs:
      inventory_sha256:
        required: true
        type: string
      crates_inventory_sha256:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      approval_record:
        required: true
        type: string
      candidate_run_id:
        required: true
        type: string
      candidate_run_attempt:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.R3_PUBLISH_ENABLED == 'true' }} # Unset: disabled until R1 integration is reviewed.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      R1_APPROVAL_RECORD: ${{ inputs.approval_record }}
      R1_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      R1_CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      R1_INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
      R3_INVENTORY_SHA256: ${{ inputs.crates_inventory_sha256 }}
      R1_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # R1 materializes its durable candidate; never download arbitrary PR artifacts
      # or rebuild absent packages. Gate verifies exact-SHA checks and protected
      # environment/tag configuration with administrator bypass disabled.
      - name: Materialize and validate the retained approved candidate (R1 integration)
        run: |
          test -x packaging/release-gate
          packaging/release-gate materialize --channel crates-io --output "$RUNNER_TEMP/crates-candidate"
          packaging/release-gate verify --channel crates-io --inventory-sha256 "$R1_INVENTORY_SHA256" --source-sha "$R1_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Revalidate frozen crates and public corresponding source before credentials
        run: node packaging/publish-crates.mjs --verify "$RUNNER_TEMP/crates-candidate" "$R3_INVENTORY_SHA256"
      - name: Obtain a temporary token after preflight; revoke it in the action post step
        id: cratesio
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e # main @ 2026-10-15
      - name: Upload frozen bytes in dependency order, revalidating at every boundary
        run: node packaging/publish-crates.mjs "$RUNNER_TEMP/crates-candidate" "$R3_INVENTORY_SHA256"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}

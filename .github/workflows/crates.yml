name: crates

'on':
  pull_request:
    paths:
    - .github/workflows/**
    - .github/actions/**
    - packaging/**
    - Cargo.toml
    - Cargo.lock
    - dist-workspace.toml
    - flake.nix
    - flake.lock
    - nix/**
    - .cargo/**
    - rust-toolchain*
    - crates/**/build.rs
    - web/package.json
    - web/pnpm-lock.yaml
    - web/*.config.*
    - web/tsconfig*.json
    - adapters/**
    - crates/hennery-host/manifest.json
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
    - .github/actions/**
    - packaging/**
    - Cargo.toml
    - Cargo.lock
    - dist-workspace.toml
    - flake.nix
    - flake.lock
    - nix/**
    - .cargo/**
    - rust-toolchain*
    - crates/**/build.rs
    - web/package.json
    - web/pnpm-lock.yaml
    - web/*.config.*
    - web/tsconfig*.json
    - adapters/**
    - crates/hennery-host/manifest.json
  workflow_call: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # No caches restored: release qualification builds the complete candidate.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Scratch homes and isolated MSRV toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r3-home"
          {
          echo "HOME=$RUNNER_TEMP/r3-home"
          echo "CARGO_HOME=$RUNNER_TEMP/r3-home/cargo"
          echo "RUSTUP_HOME=$RUNNER_TEMP/r3-home/rustup"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/r3-home/config"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/r3-home/cache"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/r3-home/data"
          echo "npm_config_userconfig=$RUNNER_TEMP/r3-home/npmrc"
          echo "npm_config_cache=$RUNNER_TEMP/r3-home/npm-cache"
          } >> "$GITHUB_ENV"
      - name: Package, source and publisher refusal tests
        run: nix develop -c node --test packaging/crates.test.mjs packaging/crate-release.test.mjs packaging/publish-crates.test.mjs packaging/binstall-policy.test.mjs packaging/stage-crates.test.mjs
      - name: Only the CLI has release archives, installers and release features
        run: |
          nix develop -c sh packaging/install-dist.sh "$RUNNER_TEMP/dist-bin"
          R3_DIST="$RUNNER_TEMP/dist-bin/dist" nix develop -c node packaging/check-dist-plan.mjs
      - name: Prove OS network denial and unsupported-host refusal
        run: nix develop -c node packaging/check-offline.mjs
      - name: Pin the consumption toolchain independently of preparation Cargo
        run: nix develop -c rustup toolchain install 1.88.0 --profile minimal
      - name: Prepare all seven from this exact source revision; inspect every final tarball
        run: nix develop -c node packaging/prepare-crates.mjs "$RUNNER_TEMP/crates-candidate" "$GITHUB_SHA"
      - name: Cargo package verification, publish dry runs, OS network-denied builds and locked/unlocked installs
        shell: bash
        run: nix develop -c sh packaging/ci-crates.sh "$RUNNER_TEMP/crates-candidate"
      - name: Pinned native binstall refuses until the verification bridge is reviewed
        run: nix develop -c node packaging/check-binstall.mjs
      - name: Compiled package build-script precedence/refusals
        run: |
          nix develop -c cargo build -p hennery-kernel --locked
          nix develop -c node --test packaging/check-package-build.test.mjs
